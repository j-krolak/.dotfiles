general {
	hide_cursor = true
}

input-field {
    monitor =
    size = 250, 55
    outline_thickness = 0
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.25
    dots_rounding = -1
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(120, 220, 150, 1.0)
    fail_color = rgba(235, 75, 75, 1.0)
    fail_text = invalid password
    fade_on_empty = false
    font_family = MesloLGS NF
    placeholder_text = :) 
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}
