# imo C-a is more accessible
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Dont need status bar the most time
# set -g status off
set -g status on

# Vim-like moving between panes
# bind -n C-down select-pane -D
# bind -n C-up select-pane -U
# bind -n C-left select-pane -L
# bind -n C-right select-pane -R

# Start numbering windows/panes from 1 (nicer with prefix + number)
set -g base-index 1
setw -g pane-base-index 1

# Vim-like keys in copy-mode
set -g mode-keys vi

# --- Status bar (Nord palette) ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style fg="#D8DEE9",bg=default

set -g status-left-length 30
set -g status-left "#[fg=#2E3440,bg=#81A1C1,bold] #S #[default] "
set -g status-right ""

# Window (tab) list: plain rectangles separated by a gap
set -g window-status-format "#[fg=#D8DEE9,bg=#3B4252] #I #W "
set -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0,bold] #I #W "
set -g window-status-separator " "

set -g message-style fg="#88C0D0",bg="#3B4252"
set -g message-command-style fg="#88C0D0",bg="#3B4252"
setw -g clock-mode-colour "#88C0D0"

# --- Pane border styling ---
set -g pane-border-style fg="#3B4252"
set -g pane-active-border-style fg="#88C0D0"
set -g pane-border-lines single

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
